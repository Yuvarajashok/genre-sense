<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - GenreSence</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="logo" style="display:flex;align-items:center;gap:10px;">
        <img src="/gs_logo.webp" alt="GenreSence Logo" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">
        <span>GenreSence</span>
    </div>
    <nav>
        <a href="/page/dashboard" class="nav-link">📊 Dashboard</a>
        <a href="/page/history" class="nav-link active">📜 History</a>
        <a href="/page/profile" class="nav-link">👤 Profile</a>
        <a href="/page/about" class="nav-link">ℹ️ About</a>
    </nav>
    <div style="margin-top:auto;">
        <button onclick="User.logout()" class="btn btn-secondary" style="width:100%;">Logout</button>
    </div>
</div>

<!-- Main -->
<div class="main-content">
    <div class="header">
        <h1>Analysis History</h1>
    </div>

    <div class="card">
        <table style="width:100%;border-collapse:collapse;text-align:left;">
            <thead>
                <tr style="border-bottom:1px solid var(--border);">
                    <th style="padding:15px;">Image</th>
                    <th style="padding:15px;">Top Genre</th>
                    <th style="padding:15px;">Confidence</th>
                    <th style="padding:15px;">Date</th>
                    <th style="padding:15px;">Actions</th>
                </tr>
            </thead>
            <tbody id="history-table">
                <!-- Filled dynamically -->
            </tbody>
        </table>
    </div>
</div>

<script src="../js/app.js"></script>
<script>
User.requireAuth();

async function loadHistory(){
    const user = User.get();
    if (!user) {
        User.logout();
        return;
    }

    const tbody = document.getElementById('history-table');
    tbody.innerHTML = `
        <tr>
            <td colspan="5" style="padding:20px;text-align:center;color:var(--text-muted);">
                Loading history…
            </td>
        </tr>
    `;

    try {
        const data = await api.get(`/history/${user.id}`);

        tbody.innerHTML = '';

        if (!data.length) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="5" style="padding:20px;text-align:center;color:var(--text-muted);">
                        No analysis history found.
                    </td>
                </tr>
            `;
            return;
        }

        data.forEach(item => {
            const date = new Date(item.timestamp).toLocaleDateString();
            tbody.insertAdjacentHTML('beforeend', `
                <tr style="border-bottom:1px solid var(--border);">
                    <td style="padding:15px;">${item.image_name}</td>
                    <td style="padding:15px;">
                        <span class="genre-badge">${item.top_genre}</span>
                    </td>
                    <td style="padding:15px;">
                        ${(item.confidence * 100).toFixed(1)}%
                    </td>
                    <td style="padding:15px;">${date}</td>
                    <td style="padding:15px;">
                        <button class="btn btn-danger"
                                style="padding:5px 10px;font-size:.8rem;"
                                onclick="deleteItem(${item.id})">
                            Delete
                        </button>
                    </td>
                </tr>
            `);
        });

    } catch (err) {
        tbody.innerHTML = `
            <tr>
                <td colspan="5" style="padding:20px;text-align:center;color:#ef4444;">
                    Failed to load history.
                </td>
            </tr>
        `;
    }
}

async function deleteItem(id){
    if (!confirm("Are you sure you want to delete this record?")) return;

    try {
        const res = await fetch(`${API_BASE}/history/${id}`, { method:'DELETE' });
        if (!res.ok) throw new Error();
        loadHistory();
    } catch {
        alert("Delete failed. Please try again.");
    }
}

loadHistory();
</script>

</body>
</html>
